<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Muslim Exception — Goran Kolouch | EqualFaith Europe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12182A;
    --ink-soft:#1B2338;
    --paper:#F6F2E8;
    --paper-dim:#EEE8DA;
    --oxblood:#7A2331;
    --oxblood-bright:#9C3A47;
    --stone:#C7C1B2;
    --charcoal:#241F1A;
    --gold:#A6863E;
    --hair: rgba(198,193,178,0.22);
    --hair-dark: rgba(36,31,26,0.14);

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --paper:#12182A; --paper-dim:#0E1322; --charcoal:#E9E4D6; --hair-dark: rgba(233,228,214,0.12); }
  }
  :root[data-theme="dark"]{ --paper:#12182A; --paper-dim:#0E1322; --charcoal:#E9E4D6; --hair-dark: rgba(233,228,214,0.12); }

  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{ box-sizing: inherit; }
  html,body{ height:auto; margin:0; }
  body{
    background: var(--paper);
    color: var(--charcoal);
    font-family: "Public Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  ::selection{ background: var(--oxblood); color: #F6F2E8; }

  a{ color: inherit; }
  img{ max-width: 100%; display:block; }

  .wrap{ max-width: 1120px; margin: 0 auto; padding: 0 28px; }

  /* ---------- NAV ---------- */
  header.site{
    background: var(--ink);
    border-bottom: 1px solid var(--hair);
  }
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 28px;
    max-width: 1120px; margin:0 auto;
    font-size: 14px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    color:#F6F2E8; text-decoration:none;
    font-family:"Fraunces", serif; font-weight:500; font-size:17px; letter-spacing:0.01em;
  }
  .brand img{ height:22px; width:auto; }
  nav.links{ display:flex; gap:26px; flex-wrap:wrap; }
  nav.links a{ color: var(--stone); text-decoration:none; }
  nav.links a:hover{ color:#F6F2E8; }
  nav.links a.current{ color:#F6F2E8; border-bottom:1px solid var(--oxblood-bright); padding-bottom:3px; }

  /* ---------- HERO ---------- */
  .hero{
    background: var(--ink);
    color: #F1ECDD;
    padding: 64px 0 84px;
    position: relative;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, transparent 60%, var(--paper) 100%);
    pointer-events:none;
  }
  .hero-grid{
    display:grid;
    grid-template-columns: 340px 1fr;
    gap: 64px;
    align-items:center;
    position:relative; z-index:1;
  }
  .cover-frame{
    position:relative;
  }
  .cover-frame img{
    width:100%;
    box-shadow: 18px 22px 0 rgba(0,0,0,0.0), 0 30px 60px -18px rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.08);
    transform: rotate(-1.4deg);
  }
  .cover-frame .spine-tag{
    position:absolute; top:-14px; left:-14px;
    background: var(--oxblood);
    color:#F6F2E8;
    font-size:11.5px; letter-spacing:0.06em;
    padding:6px 11px;
    transform: rotate(-3deg);
    font-family:"Public Sans"; font-weight:600;
  }

  .hero-copy .kicker{
    font-family:"Public Sans"; font-size:13.5px; color: var(--stone);
    display:flex; align-items:center; gap:10px; margin-bottom:22px;
  }
  .hero-copy .kicker .rule{ width:34px; height:1px; background: var(--gold); display:inline-block; }

  .hero-copy h1{
    font-family:"Fraunces", serif;
    font-weight:400;
    font-size: clamp(38px, 5.4vw, 60px);
    line-height:1.04;
    margin: 0 0 18px;
    color:#F8F4E8;
  }
  .hero-copy .subtitle{
    font-family:"Fraunces", serif;
    font-style: italic;
    font-weight:300;
    font-size: clamp(18px, 2.1vw, 22px);
    color: var(--stone);
    margin: 0 0 26px;
    max-width: 46ch;
    line-height:1.35;
  }
  .hero-copy .byline{
    font-size:14px; color:#F1ECDD; margin-bottom:26px;
    letter-spacing:0.01em;
  }
  .hero-copy .byline strong{ font-weight:600; }

  .hero-copy .lede{
    max-width:52ch;
    font-size:16px; line-height:1.65; color: #D9D3C2;
    margin-bottom: 34px;
  }

  .cta-row{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  .btn-buy{
    display:inline-block;
    background: var(--oxblood);
    color:#F8F4E8;
    text-decoration:none;
    padding: 14px 26px;
    font-size:15px; font-weight:600;
    border: 1px solid var(--oxblood);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .btn-buy:hover{ background: transparent; color:#F8F4E8; border-color: var(--oxblood-bright); }
  .price-note{ font-size:13px; color: var(--stone); }

  /* ---------- PURPOSE STRIP ---------- */
  .purpose{
    background: var(--paper-dim);
    border-bottom: 1px solid var(--hair-dark);
    padding: 22px 0;
  }
  .purpose p{
    margin:0; font-size:14.5px; line-height:1.6; color: var(--charcoal);
    max-width: 74ch;
  }
  .purpose strong{ color: var(--oxblood); font-weight:600; }

  /* ---------- SECTIONS ---------- */
  section.block{ padding: 74px 0; border-bottom:1px solid var(--hair-dark); }
  section.block:last-of-type{ border-bottom:none; }

  .section-head{
    display:grid; grid-template-columns: 260px 1fr; gap:48px;
    margin-bottom: 38px;
  }
  .section-head h2{
    font-family:"Fraunces", serif; font-weight:400;
    font-size: clamp(26px, 3vw, 32px);
    line-height:1.15; margin:0;
    color: var(--charcoal);
  }
  .section-head .eyebrow{
    font-size:13px; color: var(--gold); letter-spacing:0.02em;
    font-weight:600;
  }

  .prose{ max-width: 66ch; }
  .prose p{ font-size:16px; line-height:1.75; margin: 0 0 18px; color: var(--charcoal); }
  .prose p:last-child{ margin-bottom:0; }

  /* pull quote */
  .pull{
    font-family:"Fraunces", serif; font-weight:400; font-style: italic;
    font-size: clamp(24px, 3.4vw, 34px);
    line-height:1.35;
    color: var(--charcoal);
    border-left: 3px solid var(--oxblood);
    padding: 4px 0 4px 28px;
    margin: 8px 0 0;
    max-width: 34ch;
  }

  /* contents list */
  .toc{ list-style:none; margin:0; padding:0; max-width:66ch; }
  .toc li{
    display:flex; gap:22px;
    padding: 18px 0;
    border-top: 1px solid var(--hair-dark);
    align-items:baseline;
  }
  .toc li:last-child{ border-bottom:1px solid var(--hair-dark); }
  .toc .num{
    font-family:"Fraunces", serif; font-size:15px; color: var(--gold); width:26px; flex-shrink:0;
  }
  .toc .t{ font-size:16px; color: var(--charcoal); line-height:1.4; }
  .toc .t small{ display:block; font-size:13px; color:#8A8272; margin-top:4px; font-family:"Public Sans"; }

  /* author */
  .author-grid{
    display:grid; grid-template-columns: 150px 1fr; gap:30px; align-items:start; max-width:66ch;
  }
  .author-mark{
    width:150px; height:150px;
    background: var(--ink);
    overflow:hidden;
    border: 1px solid var(--hair-dark);
  }
  .author-name{ font-family:"Fraunces", serif; font-size:20px; margin:0 0 6px; color:var(--charcoal); }
  .author-role{ font-size:13.5px; color: var(--gold); margin-bottom:14px; font-weight:600; }

  /* proceeds / transparency tie-in */
  .proceeds{
    background: var(--ink);
    color:#F1ECDD;
    padding: 64px 0;
  }
  .proceeds .section-head h2, .proceeds .eyebrow{ color:#F8F4E8; }
  .proceeds .eyebrow{ color: var(--gold); }
  .proceeds .prose p{ color:#D9D3C2; }
  .proceeds-stat{
    border-top:1px solid var(--hair);
    margin-top:30px; padding-top:20px;
    font-size:13.5px; color: var(--stone);
    max-width:66ch;
  }

  /* final CTA */
  .final{
    padding: 80px 0 90px;
    text-align:left;
  }
  .final h2{
    font-family:"Fraunces", serif; font-weight:400;
    font-size: clamp(28px, 4vw, 40px);
    max-width: 22ch; margin: 0 0 28px; color: var(--charcoal); line-height:1.15;
  }

  footer.site{
    background: var(--ink); color: var(--stone);
    padding: 48px 0 40px;
    font-size:13.5px;
  }
  footer.site .wrap{ display:grid; grid-template-columns: 2fr 1fr 1fr; gap:36px; }
  footer.site h4{ color:#F1ECDD; font-size:13px; margin:0 0 12px; font-weight:600; }
  footer.site a{ color: var(--stone); text-decoration:none; display:block; margin-bottom:8px; }
  footer.site a:hover{ color:#F1ECDD; }
  footer.site .legal{ margin-top:34px; padding-top:20px; border-top:1px solid var(--hair); font-size:12.5px; grid-column: 1 / -1; }

  /* ---------- responsive ---------- */
  @media (max-width: 760px){
    .hero-grid{ grid-template-columns: 1fr; gap:38px; }
    .cover-frame{ max-width:220px; margin:0 auto; }
    .hero-copy{ text-align:left; }
    .section-head{ grid-template-columns: 1fr; gap:14px; }
    .author-grid{ grid-template-columns: 90px 1fr; }
    .author-mark{ width:90px; height:90px; font-size:24px; }
    footer.site .wrap{ grid-template-columns: 1fr 1fr; }
    footer.site .legal{ grid-column: 1 / -1; }
    nav.links{ display:none; }
    .nav{ justify-content:flex-start; }
  }

  :focus-visible{ outline: 2px solid var(--oxblood-bright); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
